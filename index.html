<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Mượn thiết bị - Trang chủ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1 class="logo-highlight">NIIE</h1>
            <span class="logo-text">QUẢN LÝ MƯỢN THIẾT BỊ<br>PHÒNG HỌC</span>
        </div>
        
        <div class="auth-buttons" id="auth_section">
            <button class="btn-outline" onclick="window.location.href='login.html'">Đăng nhập</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Đăng ký</button>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>MƯỢN THIẾT BỊ PHÒNG HỌC<br>NHANH CHÓNG</h2>
            <button class="btn-primary large-btn" id="btn_hero_action" onclick="window.location.href='login.html'">Mượn thiết bị nhanh chóng</button>
        </div>
    </section>

    <div id="ds_thietbi_trangchu" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; padding-bottom: 40px;">
        <!-- Dữ liệu render từ JS -->
    </div>
    
    <script src="main.js"></script>
</body>
</html>
