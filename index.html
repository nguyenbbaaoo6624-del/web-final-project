<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hệ thống</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper">
        <h2>Đăng nhập Hệ thống Quản lý Thiết bị</h2>
        <form id="loginForm">
            
            <label>Tài khoản:</label>
            <input type="text" id="username" required>
            
            <label>Mật khẩu:</label>
            <input type="password" id="password" required>
            
            <label>Vai trò đăng nhập:</label>
            <select id="role">
                <option value="sinhvien">Sinh viên / Giáo viên</option>
                <option value="admin">Quản trị viên (Admin)</option>
            </select>
            
            <button type="button" onclick="xuLyDangNhap()">Đăng nhập</button>
            
            <div style="margin-top: 15px; text-align: center;">
                <a href="register.html">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
