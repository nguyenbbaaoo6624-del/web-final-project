<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Mượn thiết bị - Trang chủ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Thanh điều hướng -->
    <header class="navbar">
        <div class="logo">
            <h1 class="logo-highlight">USSH</h1>
            <span class="logo-text">QUẢN LÝ MƯỢN THIẾT BỊ<br>PHÒNG HỌC</span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="🔍 Tìm kiếm...">
        </div>
        <div class="auth-buttons">
            <button class="btn-outline" onclick="window.location.href='login.html'">Đăng nhập</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Đăng ký</button>
        </div>
    </header>

    <!-- Banner chính -->
    <section class="hero">
        <div class="hero-content">
            <h2>MƯỢN THIẾT BỊ PHÒNG HỌC<br>NHANH CHÓNG</h2>
            <button class="btn-primary large-btn" onclick="window.location.href='login.html'">Tra cứu ngay</button>
        </div>
    </section>

    <!-- Danh sách thiết bị phổ biến -->
    <section class="popular-devices">
        <h3>Thiết bị Phổ biến</h3>
        <div class="device-grid">
            <div class="device-card">
                <div class="device-icon">📽️</div>
                <div class="device-info">
                    <h4>Máy chiếu</h4>
                    <button class="btn-primary" onclick="window.location.href='login.html'">Đăng ký</button>
                </div>
            </div>
            
            <div class="device-card">
                <div class="device-icon">💻</div>
                <div class="device-info">
                    <h4>Laptop</h4>
                    <button class="btn-primary" onclick="window.location.href='login.html'">Đăng ký</button>
                </div>
            </div>

            <div class="device-card">
                <div class="device-icon">🎤</div>
                <div class="device-info">
                    <h4>Micro</h4>
                    <button class="btn-primary" onclick="window.location.href='login.html'">Đăng ký</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
